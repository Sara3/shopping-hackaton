<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400"><rect width="680" height="400" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="34" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">1 · normal: you send a helper to buy one gift</text><rect x="60" y="46" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text x="135.0" y="68" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">You</text><text x="135.0" y="86" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">ask for a scarf</text><rect x="265" y="46" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="340.0" y="68" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">Helper + key</text><text x="340.0" y="86" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">key buys anything</text><rect x="470" y="46" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><text x="545.0" y="68" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">Store (Arcade)</text><text x="545.0" y="86" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">makes and ships</text><line x1="212" y1="74" x2="263" y2="74" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="417" y1="74" x2="468" y2="74" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="40" y="150" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">2 · the problem: a bad note tricks the same helper</text><rect x="60" y="162" width="150" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/><text x="135.0" y="184" font-size="14" font-weight="bold" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">Bad note</text><text x="135.0" y="202" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">“make it 50”</text><rect x="265" y="162" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="340.0" y="184" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">Helper</text><text x="340.0" y="202" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">reads it, obeys</text><rect x="470" y="162" width="150" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/><text x="545.0" y="184" font-size="14" font-weight="bold" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">Wrong order</text><text x="545.0" y="202" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">50 for $4,000</text><line x1="212" y1="190" x2="263" y2="190" stroke="#D85A30" stroke-width="1.5" marker-end="url(#b)"/><line x1="417" y1="190" x2="468" y2="190" stroke="#D85A30" stroke-width="1.5" marker-end="url(#b)"/><text x="40" y="266" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">3 · the fix: the helper only gets a limited pass</text><rect x="60" y="278" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="135.0" y="300" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">Helper + leash</text><text x="135.0" y="318" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">1 scarf, max $150</text><rect x="265" y="278" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="340.0" y="300" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">Checker</text><text x="340.0" y="318" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">off-list? freeze</text><rect x="470" y="278" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="545.0" y="300" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">Note bounced</text><text x="545.0" y="318" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">you stay safe</text><line x1="212" y1="306" x2="263" y2="306" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="417" y1="306" x2="468" y2="306" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="340" y="372" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif">same helper, same bad note: the pass is the only difference</text></svg>